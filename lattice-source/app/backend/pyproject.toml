[project]
name = "oasis-engine"
version = "0.2.8"
description = "Offline vectorless-RAG engine for the Oasis assembly-line assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-ai-slim[openai]>=2.40,<2.60",  # 2.60 changes validation retries (FIXES-TODO #11)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdfium2>=5",  # renders manual pages that hold figures (Apache-2.0 / BSD-3)
    "pillow>=10",
    "numpy>=1.26",  # search by meaning: cosine similarity over section vectors (BSD-3)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oasis_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
